version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'
    networks:
      - influencer_platform_network
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis service for caching
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - '6379:6379'
    networks:
      - influencer_platform_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API service
  api:
    build:
      context: ./influencer-platform-api
      dockerfile: Dockerfile
    container_name: influencer_api
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '5000:5000'
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/influencer-platform
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONTEND_URL=http://localhost:3000
      - BASE_URL=http://localhost:5000
      # Add other environment variables as needed
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    networks:
      - influencer_platform_network
  # Frontend Next.js service
  frontend:
    build:
      context: ./influencer-platform
      dockerfile: Dockerfile
    container_name: influencer_frontend
    restart: always
    depends_on:
      - api
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
      # For internal communication within Docker network
      - NEXT_PRIVATE_BACKEND_URL=http://api:5000
    networks:
      - influencer_platform_network

# Define volumes
volumes:
  mongodb_data:
  uploads_data:
  logs_data:

# Define networks
networks:
  influencer_platform_network:
    driver: bridge
